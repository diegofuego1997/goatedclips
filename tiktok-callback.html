<p id="msg" class="lead">Handing the sign-in back to Goated Clips Uploader on this computer.</p>
<script>
(function () {
  var q = new URLSearchParams(location.search);

  if (q.get("error")) {
    msg.textContent = "TikTok sign-in was cancelled or failed: " + (q.get("error_description") || q.get("error"));

  }
  if (!q.get("code")) { msg.textContent = "No sign-in code received."; return; }
  // Goated Clips Uploader listens locally on this computer only.
  location.replace("http://127.0.0.1:8765/tiktok/callback" + location.search);
})();
</script>
